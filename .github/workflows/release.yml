name: Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  package-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Distribution Bundle
        run: |
          mkdir -p build/CaritasScripts/scripts build/CaritasScripts/setup build/CaritasScripts/config
          cp Caritas-Verwaltung*.cmd build/CaritasScripts/
          cp scripts/*.ps1 build/CaritasScripts/scripts/
          cp setup/*.ps1 build/CaritasScripts/setup/
          cp setup/*.cmd build/CaritasScripts/setup/ 2>/dev/null || true
          cp setup/*.xml build/CaritasScripts/setup/ 2>/dev/null || true
          cp version.json build/CaritasScripts/
          cp version.json build/CaritasScripts/config/
          cp README.md HANDBUCH.* software-inventory*.md build/CaritasScripts/ 2>/dev/null || true
          cd build && zip -r ../CaritasScripts.zip . && cd ..
          sha256sum CaritasScripts.zip > CaritasScripts.zip.sha256
          echo "Generated SHA256 checksum:"
          cat CaritasScripts.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            CaritasScripts.zip
            CaritasScripts.zip.sha256
            HANDBUCH.pdf
          generate_release_notes: true
